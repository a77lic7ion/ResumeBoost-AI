<!DOCTYPE html>
<html lang="en-ZA" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResumeBoost AI | AI-Powered Resume Optimization</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#2563EB", 
              "primary-hover": "#1d4ed8",
              "background-light": "#F9FAFB",
              "background-dark": "#05070A",
            },
            fontFamily: {
              sans: ["Sora", "sans-serif"],
              display: ["Sora", "sans-serif"],
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
      .dark ::-webkit-scrollbar-thumb { background: #1e293b; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }

      .gradient-bg {
        background-color: #05070A;
        background-image: 
          radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.08) 0%, transparent 40%),
          radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.05) 0%, transparent 40%);
      }
      
      .gradient-btn {
        background: #2563EB;
        transition: all 0.2s ease-in-out;
      }
      .gradient-btn:hover { background: #1d4ed8; transform: translateY(-1px); }

      .glass-effect {
        background: rgba(18, 20, 29, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .prose h1, .prose h2, .prose h3 {
        margin-top: 1.5em;
        margin-bottom: 0.5em;
        font-weight: 700;
        line-height: 1.2;
      }
      .prose h1 { font-size: 1.75em; border-bottom: 2px solid #1e293b; padding-bottom: 0.2em; }
      .prose p { margin-bottom: 1em; line-height: 1.6; }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "mammoth": "https://cdn.jsdelivr.net/npm/mammoth@1.6.0/+esm",
    "marked": "https://cdn.jsdelivr.net/npm/marked@12.0.0/+esm",
    "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.0.9/+esm",
    "diff": "https://cdn.jsdelivr.net/npm/diff@5.1.0/+esm"
  }
}
</script>
</head>
  <body class="bg-background-dark text-gray-200 antialiased font-sans transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
